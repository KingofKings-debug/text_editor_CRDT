
name: Deploy to EC2

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
                "sudo -u ec2-user bash -lc '\''cd /home/ec2-user/myproject/text_editor_CRDT && git pull origin main && npm ci --prefix ./express-backend && npm ci --prefix ./frontend && if pm2 describe backend >/dev/null 2>&1; then pm2 restart backend --update-env; else pm2 start npm --name backend --prefix ./express-backend -- run dev; fi && if pm2 describe frontend >/dev/null 2>&1; then pm2 restart frontend --update-env; else pm2 start npm --name frontend --prefix ./frontend -- run dev; fi && pm2 save'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true
          echo "=========SSM COMMAND RESULT========"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'\
            --output json